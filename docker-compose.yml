services:
  postgres:
    image: postgres:16-alpine
    container_name: tfa-postgres
    environment:
      POSTGRES_DB: tfa
      POSTGRES_USER: tfa
      POSTGRES_PASSWORD: tfa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tfa -d tfa']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tfa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tfa
      RABBITMQ_DEFAULT_PASS: tfa
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
